<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keynote.io Live Preview</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #60a5fa;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #020817 0%, var(--bg) 100%);
        color: var(--text);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 16px 24px;
        background: rgba(17, 24, 39, 0.9);
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(8px);
      }

      .title {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .badge {
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(96, 165, 250, 0.12);
        border: 1px solid rgba(96, 165, 250, 0.38);
        color: var(--accent);
        font-size: 0.8rem;
      }

      .frame-wrap {
        padding: 20px;
        height: calc(100vh - 72px);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 14px;
        background: white;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="title">Keynote.io Live Preview</div>
      <div class="badge">Sample page</div>
    </div>

    <div class="frame-wrap">
      <iframe src="keynote.io.html" title="Keynote.io preview"></iframe>
    </div>
  </body>
</html>
