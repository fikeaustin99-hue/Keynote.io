<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keynote.io Live Preview</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #94a3b8;
        --accent: #60a5fa;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #020817 0%, var(--bg) 100%);
        color: var(--text);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 16px 24px;
        background: rgba(17, 24, 39, 0.9);
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(8px);
      }

      .title {
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .badge {
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(96, 165, 250, 0.12);
        border: 1px solid rgba(96, 165, 250, 0.38);
        color: var(--accent);
        font-size: 0.8rem;
      }

      .frame-wrap {
        padding: 20px;
        height: calc(100vh - 72px);
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 14px;
        background: white;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="title">Keynote.io Live Preview</div>
      <div class="badge">GitHub Pages</div>
    </div>

    <div class="frame-wrap" id="container">
      <!-- Content will be injected here -->
    </div>

    <script>
      // Fetch and inject the keynote.io.html content directly
      fetch('keynote.io.html')
        .then(response => response.text())
        .then(html => {
          // Parse the HTML to extract just the content (skip the outer html/head/body tags)
          const parser = new DOMParser();
          const doc = parser.parseFromString(html, 'text/html');
          
          // Get the container
          const container = document.getElementById('container');
          
          // Move the main content into the container
          if (doc.querySelector('main')) {
            container.innerHTML = '';
            container.style.padding = '0';
            container.style.height = '100%';
            container.appendChild(doc.querySelector('main'));
          }
          
          // Inject styles from the original document
          const styleTag = document.createElement('style');
          const allStyles = Array.from(doc.querySelectorAll('style'))
            .map(s => s.textContent)
            .join('\n');
          styleTag.textContent = allStyles;
          document.head.appendChild(styleTag);
          
          // Inject scripts
          const scripts = doc.querySelectorAll('script');
          scripts.forEach(script => {
            const newScript = document.createElement('script');
            newScript.type = script.type;
            newScript.textContent = script.textContent;
            if (script.src) newScript.src = script.src;
            document.body.appendChild(newScript);
          });
        })
        .catch(err => {
          document.getElementById('container').innerHTML = `
            <div style="padding: 2rem; text-align: center; color: #ef4444;">
              <h2>Unable to load Keynote.io</h2>
              <p>${err.message}</p>
            </div>
          `;
        });
    </script>
  </body>
</html>
