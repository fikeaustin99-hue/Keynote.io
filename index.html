<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Keynote.io - Play piano. Claim land. A rhythmic music game where you build your territory through skill." />
    <meta name="theme-color" content="#0B2545" />
    <title>Keynote.io - Music Gaming Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sea: #0B2545;
            --shallow: #13406B;
            --land: #F2C14E;
            --land-d: #B58A1F;
            --key: #F4F7FA;
            --ink: #0B2545;
            --text: #EAF1F8;
            --mute: #9DB4CC;
            --dark-bg: #020817;
            --accent-pink: #FFD3E1;
            --accent-red: #FF7B7B;
            --neon-cyan: #00D4FF;
            --neon-purple: #D946FF;
            --neon-pink: #FF1E7E;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a0a2e 50%, #16213e 100%);
            color: var(--text);
            line-height: 1.6;
            position: relative;
        }

        /* Neon Space Animated Background */
        .bg-neon-space {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .starfield {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(255, 255, 255, 0.2)),
                radial-gradient(2px 2px at 60px 70px, #fff, rgba(255, 255, 255, 0.3)),
                radial-gradient(1px 1px at 50px 50px, #ddd, rgba(255, 255, 255, 0.2)),
                radial-gradient(1px 1px at 130px 80px, #fff, rgba(255, 255, 255, 0.2)),
                radial-gradient(2px 2px at 90px 10px, #fff, rgba(255, 255, 255, 0.3));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: starTwinkle 5s ease-in-out infinite;
        }

        @keyframes starTwinkle {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Animated Neon Grid */
        .neon-grid {
            position: absolute;
            width: 120%;
            height: 120%;
            top: -10%;
            left: -10%;
            background-image:
                linear-gradient(0deg, transparent 24%, rgba(0, 212, 255, 0.08) 25%, rgba(0, 212, 255, 0.08) 26%, transparent 27%, transparent 74%, rgba(0, 212, 255, 0.08) 75%, rgba(0, 212, 255, 0.08) 76%, transparent 77%, transparent),
                linear-gradient(90deg, transparent 24%, rgba(217, 70, 255, 0.08) 25%, rgba(217, 70, 255, 0.08) 26%, transparent 27%, transparent 74%, rgba(217, 70, 255, 0.08) 75%, rgba(217, 70, 255, 0.08) 76%, transparent 77%, transparent);
            background-size: 100px 100px;
            background-position: 0 0, 50px 50px;
            animation: gridScroll 20s linear infinite;
            opacity: 0.6;
        }

        @keyframes gridScroll {
            0% { transform: translateY(0) translateX(0); }
            100% { transform: translateY(100px) translateX(100px); }
        }

        /* Floating Neon Orbs */
        .neon-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
        }

        .orb-cyan {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.3) 0%, transparent 70%);
            top: -100px;
            right: -50px;
            animation: floatOrb1 20s ease-in-out infinite;
        }

        .orb-purple {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(217, 70, 255, 0.25) 0%, transparent 70%);
            bottom: -80px;
            left: -80px;
            animation: floatOrb2 25s ease-in-out infinite;
        }

        .orb-pink {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 30, 126, 0.2) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: floatOrb3 30s ease-in-out infinite;
        }

        @keyframes floatOrb1 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-40px, 40px); }
        }

        @keyframes floatOrb2 {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(50px, -30px); }
        }

        @keyframes floatOrb3 {
            0%, 100% { transform: translate(-50%, -50%); }
            50% { transform: translate(-30%, -70%); }
        }

        /* Content wrapper - full viewport */
        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        /* Landing Container - Non-scrollable, Centered */
        .landing-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            text-align: center;
            max-width: 1200px;
        }

        .landing-hero {
            margin-bottom: 60px;
            animation: heroFadeIn 1s ease-out;
        }

        @keyframes heroFadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-logo {
            font-size: 80px;
            margin-bottom: 20px;
            animation: logoPulse 2s ease-in-out infinite;
        }

        @keyframes logoPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .landing-hero h1 {
            font-size: 72px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--neon-cyan) 0%, var(--neon-pink) 50%, var(--neon-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            animation: glitch 3s ease-in-out infinite;
        }

        @keyframes glitch {
            0%, 100% {
                text-shadow: 0 0 20px rgba(0, 212, 255, 0.5), 0 0 30px rgba(217, 70, 255, 0.3);
            }
            50% {
                text-shadow: 0 0 30px rgba(255, 30, 126, 0.5), 0 0 40px rgba(0, 212, 255, 0.3);
            }
        }

        .tagline {
            font-size: 28px;
            color: var(--neon-cyan);
            margin-bottom: 12px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        .game-description {
            font-size: 16px;
            color: var(--mute);
            margin-bottom: 0;
            line-height: 1.8;
            max-width: 500px;
        }

        /* GUI Icon Grid */
        .gui-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            max-width: 600px;
            margin-top: 60px;
            animation: gridFadeIn 1s ease-out 0.3s both;
        }

        @keyframes gridFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .gui-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(11, 37, 69, 0.4);
            border: 2px solid var(--neon-cyan);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.1);
        }

        .gui-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .gui-icon:hover::before {
            left: 100%;
        }

        .gui-icon:hover {
            border-color: var(--neon-pink);
            background: rgba(11, 37, 69, 0.7);
            transform: scale(1.1) translateY(-5px);
            box-shadow: 0 0 30px rgba(255, 30, 126, 0.4), 0 8px 20px rgba(0, 0, 0, 0.5);
        }

        .gui-icon-emoji {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
            animation: iconBounce 2s ease-in-out infinite;
        }

        .gui-icon:nth-child(2) .gui-icon-emoji {
            animation-delay: 0.2s;
        }

        .gui-icon:nth-child(3) .gui-icon-emoji {
            animation-delay: 0.4s;
        }

        .gui-icon:nth-child(4) .gui-icon-emoji {
            animation-delay: 0.6s;
        }

        .gui-icon:nth-child(5) .gui-icon-emoji {
            animation-delay: 0.8s;
        }

        .gui-icon:nth-child(6) .gui-icon-emoji {
            animation-delay: 1s;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .gui-icon-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--neon-cyan);
            text-align: center;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .gui-icon:hover .gui-icon-label {
            color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(255, 30, 126, 0.6);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 50px;
            flex-wrap: wrap;
            animation: buttonsFadeIn 1s ease-out 0.6s both;
        }

        @keyframes buttonsFadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn {
            padding: 14px 36px;
            border-radius: 8px;
            border: 2px solid var(--neon-cyan);
            background: transparent;
            color: var(--neon-cyan);
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-size: 14px;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(0, 212, 255, 0.2);
            transition: left 0.3s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(255, 30, 126, 0.5), 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        .btn-primary {
            background: var(--neon-cyan);
            color: var(--dark-bg);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:hover {
            background: var(--neon-pink);
            border-color: var(--neon-pink);
            box-shadow: 0 0 30px rgba(255, 30, 126, 0.6), 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .landing-hero h1 {
                font-size: 48px;
            }

            .tagline {
                font-size: 20px;
            }

            .game-description {
                font-size: 14px;
            }

            .gui-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 15px;
                max-width: 450px;
            }

            .gui-icon {
                padding: 15px;
            }

            .gui-icon-emoji {
                font-size: 36px;
            }

            .gui-icon-label {
                font-size: 11px;
            }

            .btn {
                padding: 12px 28px;
                font-size: 12px;
            }
        }

        @media (max-width: 480px) {
            .content {
                padding: 20px;
            }

            .landing-hero {
                margin-bottom: 40px;
            }

            .game-logo {
                font-size: 60px;
            }

            .landing-hero h1 {
                font-size: 36px;
                margin-bottom: 8px;
            }

            .tagline {
                font-size: 16px;
            }

            .game-description {
                font-size: 13px;
            }

            .gui-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                max-width: 300px;
                margin-top: 40px;
            }

            .gui-icon {
                padding: 12px;
            }

            .gui-icon-emoji {
                font-size: 32px;
                margin-bottom: 6px;
            }

            .gui-icon-label {
                font-size: 10px;
            }

            .action-buttons {
                flex-direction: column;
                width: 100%;
                margin-top: 40px;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Neon Space Background -->
    <div class="bg-neon-space">
        <div class="starfield"></div>
        <div class="neon-grid"></div>
        <div class="neon-orb orb-cyan"></div>
        <div class="neon-orb orb-purple"></div>
        <div class="neon-orb orb-pink"></div>
    </div>

    <!-- Content -->
    <div class="content">
        <div class="landing-container">
            <!-- Hero Section -->
            <div class="landing-hero">
                <div class="game-logo">🎹</div>
                <h1>keynote<span>.io</span></h1>
                <p class="tagline">Play Piano. Claim Land.</p>
                <p class="game-description">
                    A rhythmic music game where your musical skills determine your territory.
                </p>
            </div>

            <!-- GUI Icon Grid -->
            <div class="gui-grid">
                <div class="gui-icon" onclick="launchGame()">
                    <span class="gui-icon-emoji">▶️</span>
                    <span class="gui-icon-label">Play</span>
                </div>
                <div class="gui-icon">
                    <span class="gui-icon-emoji">🎵</span>
                    <span class="gui-icon-label">Tracks</span>
                </div>
                <div class="gui-icon">
                    <span class="gui-icon-emoji">🏝️</span>
                    <span class="gui-icon-label">Territory</span>
                </div>
                <div class="gui-icon">
                    <span class="gui-icon-emoji">🏆</span>
                    <span class="gui-icon-label">Leaderboard</span>
                </div>
                <div class="gui-icon">
                    <span class="gui-icon-emoji">⚡</span>
                    <span class="gui-icon-label">Streaks</span>
                </div>
                <div class="gui-icon" onclick="window.open('https://github.com/fikeaustin99-hue/Keynote.io', '_blank')">
                    <span class="gui-icon-emoji">💻</span>
                    <span class="gui-icon-label">GitHub</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="launchGame()">▶ Launch Game</button>
                <a href="https://github.com/fikeaustin99-hue/Keynote.io" class="btn" target="_blank">📖 Learn More</a>
            </div>
        </div>
    </div>

    <!-- Game Modal -->
    <div id="game-modal" style="display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.98); z-index: 2000; overflow: auto;">
        <div style="position: fixed; top: 20px; right: 20px; z-index: 2001;">
            <button class="btn" onclick="closeGame()">✕ Close</button>
        </div>
        <div style="width: 100%; height: 100vh; min-height: 100vh;">
            <iframe id="game-iframe" src="keynote.io.html" style="width: 100%; height: 100%; border: none; background: white;"></iframe>
        </div>
    </div>

    <script>
        function launchGame() {
            document.getElementById('game-modal').style.display = 'block';
        }

        function closeGame() {
            document.getElementById('game-modal').style.display = 'none';
        }

        // Close modal when pressing Escape
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                closeGame();
            }
        });
    </script>
</body>
</html>
